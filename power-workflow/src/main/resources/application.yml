# 公共配置（与环境无关）。中间件地址/账号、调试开关、日志级别见 application-{local|prod}.yml
server:
  port: 8083

spring:
  application:
    name: power-workflow
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: optional:classpath:middleware-defaults.yml

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

# Process 引擎；不自动扫描 classpath BPMN（内置 leave 由 bootstrap 部署）
flowable:
  check-process-definitions: false
  database-schema-update: true
  async-executor-activate: true
  history-level: audit

power:
  openapi:
    title: power-workflow API
    description: Flowable 流程定义、实例、任务、请假与演示
  security:
    whitelist:
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /actuator/health
  datasource:
    multi-enabled: false
  outbox:
    poll-interval-ms: 5000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId}] [%thread] %-5level %logger{50} - %msg%n"
