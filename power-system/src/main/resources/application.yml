# 公共配置（与环境无关）。中间件地址/账号、调试开关、日志级别见 application-{local|prod}.yml
server:
  port: 8082

spring:
  application:
    name: power-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

power:
  security:
    whitelist:
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /actuator/health
  datasource:
    multi-enabled: false
  outbox:
    poll-interval-ms: 5000

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId}] [%thread] %-5level %logger{50} - %msg%n"
